<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarah's Charting Tool</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chart.css') }}">
</head>
<body>

<!-- ── Top Bar ── -->
<div class="topbar">
  <div class="topbar-left">
    <span class="app-title">✚ Sarah's Charting Tool</span>
    <span class="app-version">v{{ version }}</span>
    <input class="patient-name-input" id="patient-name" type="text" placeholder="Patient name">
    <button class="btn-top" onclick="newChart()">+ New Chart</button>
  </div>
  <div class="topbar-right">
    {% for tpl in templates %}
    <button class="btn-tpl" data-template-id="{{ tpl.id }}" onclick="selectTemplate('{{ tpl.id }}')"
            title="{{ tpl.description }}">
      <span class="tpl-id">{{ tpl.id }}</span>
      <span class="tpl-name">{{ tpl.name }}</span>
    </button>
    {% endfor %}
  </div>
</div>

<!-- ── Main Split Screen ── -->
<div class="main-split">

  <!-- LEFT: Abbreviated Notes -->
  <div class="left-panel" id="left-panel">
    <div class="panel-header">
      <span>Abbreviated Notes from Visit</span>
    </div>
    <div class="panel-body" id="abn-form-body">
      <div class="empty-hint">← Select a template above to begin</div>
    </div>
    <div class="panel-footer no-print">
      <button class="btn-generate" id="btn-generate" onclick="generateChart()" disabled>
        Generate Chart →
      </button>
    </div>
  </div>

  <!-- RIGHT: Generated Chart -->
  <div class="right-panel" id="right-panel">
    <div class="panel-header">
      <span>Chart</span>
      <div class="panel-header-actions no-print">
        <button class="btn-action" onclick="copyChart()" id="btn-copy" disabled>⎘ Copy</button>
        <button class="btn-action" onclick="window.print()" id="btn-print" disabled>🖨 Print</button>
      </div>
    </div>
    <div class="panel-body" id="chart-output-body">
      <div class="empty-hint" id="chart-placeholder">
        Fill in notes on the left and click<br><strong>Generate Chart</strong>
      </div>
      <div class="chart-output" id="chart-output" contenteditable="true" style="display:none;"></div>
    </div>
  </div>

</div><!-- /main-split -->

<!-- Print header -->
<div class="print-header" id="print-header" style="display:none;">
  <strong id="print-patient-name"></strong>
  <span id="print-template-name"></span>
  <span id="print-date"></span>
</div>

<script src="{{ url_for('static', filename='js/chart.js') }}"></script>
</body>
</html>
